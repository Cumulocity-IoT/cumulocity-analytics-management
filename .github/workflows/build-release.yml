# Builds the web plugin and the analytics-ext-service microservice and attaches
# both archives to the GitHub release of the pushed tag (v*).
# Tags with a suffix (e.g. v2.8.0-rc.1) are published as pre-releases.

name: Build Plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # v1.0, v20.15.10, v2.8.0-rc.1, ...

# Least privilege by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_ui:
    name: Build UI plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./analytics-ui
    outputs:
      version: ${{ steps.save-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: analytics-ui/package-lock.json

      - name: Sync package.json version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Strip leading "v" — tag "v2.8.0-rc.1" becomes version "2.8.0-rc.1"
          REF_VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting package.json version to ${REF_VERSION}"
          npm version "${REF_VERSION}" --no-git-tag-version --allow-same-version

      - name: Save Version
        id: save-version
        run: echo "version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Zip build
        run: |
          cd dist/c8y-pkg-analytics-extension
          zip -r -q ../../build.zip .

      - name: Upload build artifact UI
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-ui
          if-no-files-found: error
          retention-days: 1
          path: analytics-ui/build.zip

  build_service:
    name: Build backend microservice
    needs: [build_ui]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./analytics-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: analytics-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        run: ./build.sh "${{ needs.build_ui.outputs.version }}"

      - name: Upload build artifact service
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-service
          if-no-files-found: error
          retention-days: 1
          path: analytics-service/dist/analytics-ext-service.zip

  release-assets:
    name: Release assets
    needs: [build_ui, build_service]
    # workflow_dispatch runs have no tag to attach assets to
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifact service
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-service
          path: release

      - name: Download artifact UI
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-ui
          path: release

      - name: Rename UI archive
        run: |
          # Tag "v2.8.0-rc.1" -> "c8y-pkg-analytics-extension-2.8.0-rc.1.zip"
          REF_VERSION="${GITHUB_REF_NAME#v}"
          mv release/build.zip "release/c8y-pkg-analytics-extension-${REF_VERSION}.zip"
          ls -lah release

      # One release step for both archives: two separate steps race to create the release.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
