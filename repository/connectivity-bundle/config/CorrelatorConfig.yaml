# Registers plugins/GitHubFetchPlugin.py so it can be imported from EPL via
# `import "GitHubFetchPlugin" as ...;` - see that file's header comment for why a Python
# plugin is used here instead of a connectivity chain. Structure (a top-level config/ directory
# alongside monitors/ and plugins/, all inside this same extension bundle) confirmed against a
# real Software AG Block SDK test (test/block-sdk/Extensions_Plugins in the apama-in-c8y repo),
# which proves a Python plugin can be shipped and loaded via the ordinary extension
# upload+restart flow - no separate microservice/Docker image needed.
eplPlugins:
  GitHubFetchPlugin:
    pythonFile: "${PARENT_DIR}/../plugins/GitHubFetchPlugin.py"
    class: GitHubFetchPluginClass
