# Best-effort draft, unverified — see ../../README.md.
#
# Two dynamic chains (parameterized per host/port at chain-creation time via
# @{varname} substitution from EPL's ConnectivityPlugins.createDynamicChain):
#
# - GitHubFetchChain: GET a release asset. No JSON/String codec — the body
#   stays binary end-to-end, surfaced to EPL as a Base64 string field
#   (see monitors/RawHttpEvents.mon's GitHubAssetResponse.bodyBase64).
# - InventoryUploadChain: POST multipart/form-data to the tenant's own
#   /inventory/binaries, authenticated with the apama-ctrl service user
#   (CUMULOCITY_USERNAME/CUMULOCITY_PASSWORD - see DIRECT_UPLOAD.md R1's
#   "Authentication for step 2 is not free" note). Still unverified: whether
#   those env vars are readable here via ${varname} substitution the way
#   they're documented for the Cumulocity IoT Transport chain specifically,
#   or whether that's exclusive to that transport and this needs its own
#   credential wiring (e.g. via Tenant Options, same as Q2's PAT handling).

connectivityPlugins:
  HTTPClientTransport:
    libraryName: connectivity-http-client
    class: HTTPClient
  base64Codec:
    libraryName: connectivity-base64-codec
    class: Base64Codec

dynamicChains:
  GitHubFetchChain:
    - apama.eventMap:
        eventTypes:
          - apamax.blockmarketplace.fetchextension.raw.GitHubAssetRequest
          - apamax.blockmarketplace.fetchextension.raw.GitHubAssetResponse
    - base64Codec:
        eventTypes:
          - apamax.blockmarketplace.fetchextension.raw.GitHubAssetResponse
        fields:
          - payload
    - HTTPClientTransport:
        host: "@{HOST}"
        port: "@{PORT}"
        tls: true
        followRedirects: true
        timeoutSecs: 120

  InventoryUploadChain:
    - apama.eventMap:
        eventTypes:
          - apamax.blockmarketplace.fetchextension.raw.InventoryUploadRequest
          - apamax.blockmarketplace.fetchextension.raw.InventoryUploadResponse
    - base64Codec:
        eventTypes:
          - apamax.blockmarketplace.fetchextension.raw.InventoryUploadRequest
        fields:
          # Only the file part is binary - the managed-object metadata part
          # is a plain string (JSON built by hand in EPL, no JSON codec in
          # this chain). Nested-field targeting per the Base64 codec docs'
          # own example (`payload.foo.asdf`) - unverified for a dictionary
          # value specifically named "file" vs. their generic example.
          - payload.file
    - HTTPClientTransport:
        host: "@{HOST}"
        port: "@{PORT}"
        tls: true
        timeoutSecs: 120
        authentication:
          authenticationType: basic
          username: "${CUMULOCITY_USERNAME}"
          password: "${CUMULOCITY_PASSWORD}"
