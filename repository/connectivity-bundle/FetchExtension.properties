# FetchExtension.yaml no longer defines any dynamicChains (GitHubFetchChain was removed in
# favor of config/CorrelatorConfig.yaml's GitHubFetchPlugin - see FetchExtension.yaml's header
# comment), so there's nothing left to substitute here. This file exists only because every
# real bundle we've found (the five platform ones, and the Block SDK's own
# Extensions_Plugins/SimplePlugin test) pairs its .yaml with a .properties file of the same
# base name — see ../../../../README.md "Round 7" for why we now believe this pairing (or at
# least the matching file/directory name) is what apama-ctrl's connectivity-config scan
# actually keys off, not arbitrary YAML placement under config/connectivity/<name>/.
