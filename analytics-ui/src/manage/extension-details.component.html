<c8y-title>Details {{ extensionFromCEP?.name }}</c8y-title>

<c8y-breadcrumb>
  <c8y-breadcrumb-item [icon]="'c8y-atom'" [label]="'Ecosystem' | translate"></c8y-breadcrumb-item>
  <c8y-breadcrumb-item [icon]="'c8y-streaming-analytics'" [label]="'Analytics' | translate"></c8y-breadcrumb-item>
  <c8y-breadcrumb-item [icon]="'c8y-modules'" [label]="'Manage extensions' | translate"
    [path]="'c8y-pkg-analytics-extension/manage'">
  </c8y-breadcrumb-item>
  <c8y-breadcrumb-item [label]="extensionFromCEP?.name"></c8y-breadcrumb-item>
</c8y-breadcrumb>

<div class="row p-l-24 p-r-24 p-b-24">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-header">
        <h4 class="card-title d-flex">
          <span class="m-t-8">Blocks</span>
        </h4>
      </div>
      <div class="card-block">
        <table class="table table-striped">
          <thead class="headers" role="rowgroup">
            <tr>
              <th style="width: 15%">Block Name</th>
              <th style="width: 10%">Block Category</th>
              <th>Block Description</th>
            </tr>
          </thead>
          <tbody>
            <!-- Empty state row properly inside tbody -->
            <tr *ngIf="!extensionFromCEP || extensionFromCEP?.analytics?.length == 0">
              <td></td>
              <td colspan="2">
                <c8y-ui-empty-state [icon]="'c8y-icon c8y-icon-apama-epl'"
                  [title]="'This extension contains no .mon files .' | translate" [horizontal]="false">
                </c8y-ui-empty-state>
              </td>
            </tr>

            <tr *ngFor="let block of extensionFromCEP?.analytics">
              <td [title]="block.id">{{ block.id }}</td>
              <td [title]="block.category">{{ block.category }}</td>
              <td [title]="block.description">{{ block.description }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">
        <h4 class="card-title d-flex">
          <span class="m-t-8">Files</span>
        </h4>
      </div>
      <div class="card-block">
        <table class="table table-striped">
          <thead>
            <tr>
              <th style="width: 5%"># </th>
              <th style="width: 95%">File Name</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let file of extensionContent ; let i = index">
              <td>{{i }}</td>
              <td>{{file }}</td>
            </tr>
          </tbody>

          <!-- <div class="c8y-empty-state" *ngIf="extensionContent?.length == 0">
            <h1 [c8yIcon]="'monitoring'"></h1>
            <p>
              <strong>Extension contains no file information.</strong><br />
            </p>
          </div> -->
        </table>
      </div>
    </div>
  </div>
  <div class=" col-lg-6">
    <div class="card">
      <div class="card-header">
        <h4 class="card-title d-flex">
          <span class="m-t-8">Build information</span>
        </h4>
      </div>
      <div class="card-block">
        <c8y-properties-list *ngIf="buildInformation?.length > 0" [emptyLabel]="'--'" [properties]="buildInformation">
        </c8y-properties-list>

        <div class="c8y-empty-state" *ngIf="buildInformation?.length == 0">
          <h1 [c8yIcon]="'monitoring'"></h1>
          <p>
            <strong>Extension contains no build information.</strong><br />
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
