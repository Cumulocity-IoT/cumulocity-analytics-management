<c8y-title translate>Block library</c8y-title>
<c8y-breadcrumb>
  <c8y-breadcrumb-item
    [icon]="'c8y-atom'"
    [label]="'Ecosystem' | translate"
  ></c8y-breadcrumb-item>
  <c8y-breadcrumb-item
    [icon]="'c8y-streaming-analytics'"
    [label]="'Analytics' | translate"
  ></c8y-breadcrumb-item>
  <c8y-breadcrumb-item
    [icon]="'test'"
    [label]="labels.blockLibrary | translate"
    [path]="routes.repository"
  >
  </c8y-breadcrumb-item>
</c8y-breadcrumb>

<c8y-action-bar-item
  [placement]="'right'"
  [priority]="100"
>
  <button
    type="button"
    class="btn-help btn-help--sm"
    aria-label="Help content"
    [title]="'Extension Builder Layouts' | translate"
    (click)="openLayoutHelp()"
  ></button>
</c8y-action-bar-item>
<c8y-action-bar-item
  [placement]="'left'"
  [priority]="200"
>
  <div class="c8y-select-wrapper m-l-8 m-r-8 repository-select">
    <select
      class="form-control"
      data-cy="repo-select"
      [attr.aria-label]="'Repository' | translate"
      [title]="'Repository to browse' | translate"
      [ngModel]="selectedRepositoryId"
      (ngModelChange)="selectRepository($event)"
    >
      @for (repo of repositories; track repo.id) {
        <option [value]="repo.id">{{ repo.name }}</option>
      }
    </select>
  </div>
</c8y-action-bar-item>
<c8y-action-bar-item
  [placement]="'left'"
  [priority]="190"
>
  <label
    class="c8y-switch m-b-0 m-l-8 m-r-8"
    data-cy="repo-hide-installed"
  >
    <input
      type="checkbox"
      [(ngModel)]="hideInstalled"
      (change)="updateFilter()"
    />
    <span></span> {{ 'Hide installed' | translate }}
  </label>
</c8y-action-bar-item>

<c8y-action-bar-item
  [placement]="'right'"
  [priority]="90"
>
  <button
    class="btn btn-link"
    title="{{ 'Repositories' | translate }}"
    (click)="openRepositoriesDrawer()"
  >
    <i c8yIcon="change-theme"></i>
    {{ 'Repositories' | translate }}
  </button>
</c8y-action-bar-item>

<c8y-action-bar-item
  [placement]="'right'"
  [priority]="80"
>
  <button
    class="btn btn-link"
    title="{{ 'Add extension' | translate }}"
    data-cy="repo-add-extension"
    (click)="addExtension()"
  >
    <i c8yIcon="plus-circle"></i>
    {{ 'Add extension' | translate }}
  </button>
</c8y-action-bar-item>

<c8y-action-bar-item
  [placement]="'right'"
  [priority]="70"
>
  <button
    class="btn btn-link"
    title="{{ 'Reload from server' | translate }}"
    aria-label="Reload"
    (click)="reloadAll()"
  >
    <i
      [class.icon-spin]="loading"
      c8yIcon="refresh"
    ></i>
  </button>
</c8y-action-bar-item>

@if (!backendDeployed) {
  <c8y-action-bar-item
    [placement]="'right'"
    [priority]="40"
  >
    <button
      type="button"
      class="btn btn-link"
      data-cy="repo-backend-recheck"
      title="{{ 'Check again whether the backend service is deployed' | translate }}"
      [disabled]="backendTogglePending"
      (click)="recheckBackend()"
    >
      <i
        c8yIcon="warning"
        class="text-warning"
      ></i>
      {{ 'Backend service not deployed' | translate }}
    </button>
  </c8y-action-bar-item>
}

<div class="content-fullpage border-top border-bottom">
  <!-- Add showDataGrid condition here -->
  @if (!loading && showDataGrid) {
    <div
      class="repository-grid"
      [style.--repository-badge]="repositoryBadge"
    >
      <c8y-data-grid
        id="dataGrid"
        #dataGrid
        [title]="gridTitle | translate"
        [columns]="columnsSamples"
        [rows]="(repositoryItems$ | async) ?? []"
        [pagination]="pagination"
        [selectable]="false"
        [actionControls]="actionControls"
      >
        <c8y-ui-empty-state
          [icon]="'cog'"
          [title]="'No samples to display.' | translate"
          [subtitle]="'Configure repositories.' | translate"
          [horizontal]="true"
        >
          <button
            class="btn btn-link m-t-24"
            title="{{ 'Repositories' | translate }}"
            (click)="openRepositoriesDrawer()"
          >
            <i c8yIcon="change-theme"></i>
            {{ 'Repositories' | translate }}
          </button>
        </c8y-ui-empty-state>
      </c8y-data-grid>
    </div>
  }

  @if (loading) {
    <div class="p-t-48">
      <div class="col-lg-8 col-lg-offset-2 text-center m-b-48">
        <p class="lead text-muted">
          {{
            'Please stand by until the samples are scanned for meta information. This may take a short while...'
              | translate
          }}
        </p>
      </div>
      <c8y-loading></c8y-loading>
    </div>
  }
</div>

<!-- Drawer -->
<div [class.drawerOpen]="showConfigRepositories">
  <div class="bottom-drawer">
    @if (showConfigRepositories) {
      <a17t-repositories-drawer
        (cancelled)="onRepositoryCancel()"
        (commit)="onRepositoryCommit()"
        [hideInstalled]="hideInstalled"
      >
      </a17t-repositories-drawer>
    }
  </div>
</div>
